<div class="bg" aria-hidden="true"></div>

<a class="skip" href="#app">Lompat ke konten</a>

<main id="app" class="app" tabindex="-1">

  <div class="boot" role="status" aria-live="polite">

<!-- SATU navigasi untuk seluruh aplikasi. Tidak ada layar yang membuat versinya sendiri. -->
<nav class="nav" id="nav" aria-label="Navigasi utama" hidden>
  <a class="nav__item" href="#home"  data-route="home">

<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>

<!-- Klien Supabase. Jika gagal dimuat, aplikasi tetap jalan offline (lihat core/supabase.js). -->
